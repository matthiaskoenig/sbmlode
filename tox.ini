[tox]
envlist = ty, lowest, py3.{11,12,13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
# what the tests need beyond the package, see the `test` extra
extras =
    test
# what follows `--` is passed to pytest, so that `tox r -e py3.14 --
# tests/test_ode_system.py` runs one module in the environment; without it the
# whole suite runs (without the sweep over the SBML test suite), which is what
# continuous integration does
commands =
    pytest -m "not sbml_testsuite" {posargs}

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
commands =
    ty check

[testenv:lowest]
# the lower bounds of `pyproject.toml` are a promise to every user who installs
# sbmlode next to other packages: this environment installs the oldest version
# each of them allows (`lowest-direct`, the dependencies of those stay at their
# newest) on the oldest supported python and runs the suite against it
basepython = python3.11
uv_resolution = lowest-direct

[testenv:julia]
# the generated julia code, run with julia and the packages it uses: julia on the
# path (or the command of `SBMLODE_JULIA`, e.g. a docker run) with the environment
# `tests/julia/Project.toml` instantiated and active (`JULIA_PROJECT`), see the
# `julia` job of `.github/workflows/ci-cd.yml`. The julia tests skip without julia
# elsewhere, here a missing julia fails them. Not part of `envlist`, it needs the
# toolchain.
basepython = python3.14
passenv =
    SBMLODE_JULIA
    JULIA_DEPOT_PATH
    JULIA_PROJECT
    JULIA_LOAD_PATH
    HOME
setenv =
    SBMLODE_REQUIRE_TOOLCHAINS = 1
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/test_ode_julia.py tests/test_ode_testsuite.py tests/test_ode_printers.py tests/test_ode_safety.py -k julia}

[testenv:R]
# the generated R code, run with Rscript and deSolve: Rscript on the path (or the
# command of `SBMLODE_RSCRIPT`, e.g. a docker run of the image of
# `tests/docker/r.Dockerfile`) with the package deSolve installed, see the `R` job
# of `.github/workflows/ci-cd.yml`. The R tests skip without R elsewhere, here a
# missing R fails them. Not part of `envlist`, it needs the toolchain.
basepython = python3.14
passenv =
    SBMLODE_RSCRIPT
    R_LIBS_USER
    R_LIBS_SITE
    HOME
setenv =
    SBMLODE_REQUIRE_TOOLCHAINS = 1
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/test_ode_r.py tests/test_ode_testsuite.py tests/test_ode_printers.py tests/test_ode_safety.py -k "test_r_ or [r- or [r]"}

[testenv:latex]
# the documents compiled, LaTeX with tectonic and typst with the typst package:
# tectonic on the path, see the `latex` job of `.github/workflows/ci-cd.yml`. The
# LaTeX compilations skip without tectonic elsewhere, here a missing tectonic or
# typst fails them. Not part of `envlist`, it needs the toolchain.
basepython = python3.14
passenv =
    HOME
setenv =
    SBMLODE_REQUIRE_TOOLCHAINS = 1
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/test_ode_presentation.py tests/test_ode_printers.py::test_latex_compiles tests/test_ode_printers.py::test_typst_compiles tests/test_ode_symbols.py::test_typst_symbols_compile tests/test_ode_safety.py::test_markup_in_names_is_text tests/test_ode_safety.py::test_typst_of_text_compiles tests/test_ode_safety.py::test_typst_of_text_is_no_markup tests/test_ode_safety.py::test_latex_of_text_compiles tests/test_ode_safety.py::test_typst_without_compartment_compiles tests/test_ode_safety.py::test_latex_without_compartment_compiles}
