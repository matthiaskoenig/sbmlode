[tool.bumpversion]
current_version = "0.2.0"
commit = true
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
# no tag: the bump is merged into develop through a pull request, which
# rewrites the commit, so the tag is created on develop afterwards
tag = false
sign_tags = false
tag_name = "{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""
# the release notes page of the documentation shows the notes of the new version,
# which are written before the bump
pre_commit_hooks = [
    "uv run python -m scripts.releasenotes",
    "git add docs/release-notes.md",
]

[[tool.bumpversion.files]]
filename = "./src/sbmlode/__init__.py"

[[tool.bumpversion.files]]
filename = "./CITATION.cff"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'
