[project]
site_name = "sbmlode"
site_url = "https://matthiaskoenig.github.io/sbmlode/"
site_description = "Ordinary differential equations of SBML models as python, julia and R code and as LaTeX, typst and markdown documents"
site_author = "Matthias König"

copyright = 'Copyright &copy; 2026 <a href="https://livermetabolism.com">Matthias König</a>'

repo_url = "https://github.com/matthiaskoenig/sbmlode"
repo_name = "matthiaskoenig/sbmlode"
edit_uri = "edit/develop/docs/"

# math (`$...$`, `$$...$$`) is typeset by MathJax, see `pymdownx.arithmatex`
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/mathjax/tex-mml-chtml.js",
]
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Guide" = "formats.md" },
  { "Typed target" = "typeset.md" },
  { "API reference" = "api.md" },
  { "Design" = "design/2026-10-05-ode-export-design.md" },
  { "Release notes" = "release-notes.md" },
  { "Contributing" = "development.md" },
]

[project.theme]
language = "en"
favicon = "images/favicon/favicon.ico"
logo = "images/favicon/sbmlode-200x200.png"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/sbmlode"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/sbmlode/"

# `docs/images/ode` holds the files of the export which `formats.md` includes,
# `docs/design` the plan of the export next to its design, `docs/javascripts/mathjax`
# the vendored MathJax with its readme, none of them is a page
[project.plugins.exclude]
glob = ["images/ode/*.md", "design/2026-10-05-ode-export.md", "javascripts/mathjax/README.md"]

# API reference is rendered from the docstrings, see the `docs/api` pages
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = false
# the page provides the heading, see the `docs/api` pages
show_root_heading = false
show_root_toc_entry = false
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# `--8<-- "images/ode/repressilator.py"` includes a file of `docs`, a missing one
# fails the build
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
